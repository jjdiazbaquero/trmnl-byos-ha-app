name: Minimal TRMNL BYOS Server
description: >-
  Minimal TRMNL BYOS API (setup / display / log).
  The image is rendered by an external service; a unique
  filename cache key is generated on every poll.
version: "1.0.0"
slug: trmnl_server
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
network: host
options:
  port: 10001
  image_base_url: http://192.168.178.40:10000/render
  refresh_rate: 300
schema:
  port: port
  image_base_url: str
  refresh_rate: int
ports:
  10001/tcp: 10001